name: Download licensed Commons photography and open PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: commons-photography-assets
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Create isolated asset branch
        id: branch
        run: |
          branch="assets/commons-photography-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install downloader dependency
        run: python -m pip install 'requests==2.34.2'

      - name: Validate downloader before contacting Commons
        run: |
          python -m py_compile scripts/download_commons_assets.py tests/test_download_commons_assets.py
          python -m json.tool scripts/commons-assets.json > /dev/null
          python -m unittest discover -s tests -v

      - name: Download and validate assets
        run: |
          python scripts/download_commons_assets.py
          python scripts/download_commons_assets.py --check

      - name: Commit and push assets
        id: commit
        env:
          ASSET_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/commons-assets.lock.json asserts/images/*.jpg asserts/images/IMAGE-CREDITS.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No asset changes detected; no pull request is needed.'
            exit 0
          fi
          git commit -m 'assets: add licensed Wikimedia Commons photography'
          git push origin "HEAD:$ASSET_BRANCH"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          gh pr create \
            --base main \
            --head "$ASSET_BRANCH" \
            --title 'assets: add licensed Bean Boutique photography' \
            --body 'Adds locally stored Wikimedia Commons JPEGs, a pinned source lock, and creator/source/licence attribution. The downloader uses bounded retries for rate limits and transient server errors. All assets are validated before any files are published. This PR is generated from the latest main branch.'
