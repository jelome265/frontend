name: Download licensed Commons photography and open PR
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Download and validate assets
        run: |
          python scripts/download_commons_assets.py
          python scripts/download_commons_assets.py --check
      - name: Commit downloaded files
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add asserts/images/*.jpg asserts/images/IMAGE-CREDITS.md
          if git diff --cached --quiet; then echo 'changed=false' >> "$GITHUB_OUTPUT"; else
            git commit -m 'assets: add licensed Wikimedia Commons photography'
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Open pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head "${GITHUB_REF_NAME}" --title 'feat: photo-led Bean Boutique redesign' --body 'Adds locally stored Wikimedia Commons JPEGs with creator, source and licence attribution. No Unsplash scraping or remote image dependency.'
