name: Download licensed Commons photography and push to main

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commons-photography-assets
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - name: Install downloader dependency
        run: python -m pip install 'requests==2.34.2'

      - name: Validate downloader before contacting Commons
        run: |
          python -m py_compile scripts/download_commons_assets.py tests/test_download_commons_assets.py
          python -m json.tool scripts/commons-assets.json > /dev/null
          python -m unittest discover -s tests -v

      - name: Download and validate assets
        run: |
          python scripts/download_commons_assets.py
          python scripts/download_commons_assets.py --check

      - name: Commit and push assets directly to main
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add scripts/commons-assets.lock.json asserts/images/*.jpg asserts/images/IMAGE-CREDITS.md
          git diff --cached --check

          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No asset changes detected; main is already up to date.'
            exit 0
          fi

          git switch -c "assets/commons-photography-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git commit -m 'assets: add licensed Wikimedia Commons photography'

          # Rebase the generated asset commit onto the latest main. Any conflict
          # fails closed; the final push is non-force and must be a fast-forward.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:refs/heads/main

          echo 'changed=true' >> "$GITHUB_OUTPUT"
