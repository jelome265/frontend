name: Validate Commons asset downloader

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/commons-photography.yml"
      - ".github/workflows/commons-assets-validation.yml"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: commons-assets-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python syntax and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install pinned downloader dependency
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"

      - name: Compile downloader and tests
        run: python -m py_compile scripts/download_commons_assets.py tests/test_download_commons_assets.py

      - name: Validate JSON manifest
        run: python -m json.tool scripts/commons-assets.json > /dev/null

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
